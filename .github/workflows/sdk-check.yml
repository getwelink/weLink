name: SDK 检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p test_python.py
      - run: python tools/check_reference.py
      - run: python tools/refresh_docs.py && git diff --exit-code -- docs/WEBHOOK.md docs/ERRORS.md
  node:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/node.test.mjs
  go:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: '1.21'
          cache: false
      - run: go test ./...
        working-directory: sdk/go/welink
      - run: go test ./...
        working-directory: examples/go
  java:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - run: javac -encoding UTF-8 --release 11 -d tests/out sdk/java/src/welink/WeLink.java tests/JavaSDKTest.java examples/java/Quickstart.java
      - run: java -cp tests/out JavaSDKTest
